<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>学业工作台 · 桌面小组件</title>
  <link rel="stylesheet" href="./widget.css" />
</head>
<body data-mode="widget">
  <div id="root" class="app" data-state="loading">
    <header class="bar" id="bar">
      <div class="bar-left">
        <span class="dot" id="sourceDot" title="数据来源"></span>
        <span class="bar-title">学业工作台</span>
      </div>
      <div class="bar-actions">
        <!--
          图标一律用内联 SVG（stroke=currentColor，跟随主题色），不用 emoji / Unicode 符号充当图标：
          emoji 在不同系统上字形不同、在 Electron 里会走彩色字体，和玻璃风格不搭；
          纯符号（刷新/关闭那类箭头叉号）则依赖字体是否有该字符，缺字就是方块。
          正文文案里的 emoji 不受此限。
        -->
        <button class="icon-btn" id="btnRefresh" title="刷新数据" aria-label="刷新数据">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M20 11.5a8 8 0 1 0-2.3 5.6" />
            <path d="M20.2 5v4.6h-4.6" />
          </svg>
        </button>
        <button class="icon-btn" id="btnPin" title="置顶开关" aria-label="置顶开关">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M14.6 3.6 20.4 9.4l-2.9.7-3.3 3.3-.5 3.7-1.5 1.5-6.8-6.8 1.5-1.5 3.7-.5 3.3-3.3.7-2.9Z" />
            <path d="M9.1 14.9 4 20" />
          </svg>
        </button>
        <button class="icon-btn" id="btnMin" title="隐藏窗口" aria-label="隐藏窗口">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" focusable="false">
            <path d="M6 12h12" />
          </svg>
        </button>
        <button class="icon-btn" id="btnClose" title="退出小组件" aria-label="退出小组件">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" focusable="false">
            <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
          </svg>
        </button>
      </div>
    </header>

    <main class="body" id="body">
      <p class="loading-hint">正在读取学习进度…</p>
    </main>

    <footer class="foot" id="foot">
      <span id="footText">—</span>
      <button class="link-btn" id="btnOpen">打开网页版</button>
    </footer>
  </div>
  <script src="./widget.js"></script>
</body>
</html>
